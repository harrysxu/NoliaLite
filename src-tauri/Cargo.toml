[package]
name = "nolia-lite"
version = "1.0.0"
description = "A lightweight, local-first Markdown editor"
authors = ["Nolia"]
edition = "2024"

[lib]
name = "nolia_lite_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
hex = "0.4.3"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.3.6"
tempfile = "3.24.0"
thiserror = "2.0.17"
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
tauri = { version = "2.11.1", features = ["macos-private-api"] }
objc2 = "0.6.4"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "AE", "AppleEvents", "objc2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-services", "NSData", "NSError", "NSAppleEventDescriptor", "NSAppleEventManager", "NSObject", "NSDictionary", "NSNotification", "NSString", "NSURL"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKPDFConfiguration", "WKWebView"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = ["Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
gtk = "0.18.2"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
